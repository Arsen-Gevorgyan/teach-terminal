<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Terminal Settings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="terminal-window">
        <h1>Terminal Color Theme</h1>
        <br><br>
            <div class="card-container">
                <div class="theme-card">
                    <div class="theme-preview ubuntu-bg">
                        <span class="theme-name">Ubuntu</span>
                    </div>
                    <button class="btn-select">Select</button>
                </div>
                <div class="theme-card">
                    <div class="theme-preview hacker-bg">
                        <span class="theme-name">Hacker</span>
                    </div>
                    <button class="btn-select">Select</button>
                </div>
                <div class="theme-card">
                    <div class="theme-preview kali-bg">
                        <span class="theme-name">Kali</span>
                    </div>
                    <button class="btn-select">Select</button>
                </div>
            </div>
            <br>
        <a href="index.html"><button class="btn-start">Back</button></a>
    </div>
    <script src="settings.js"></script>
    <script src="theme.js"></script>
</body>

</html>
